name: Build and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 🖥️ Install cross-env
        run: npm install -g cross-env

      - name: 🏷️ NBGV
        uses: dotnet/nbgv@master
        id: nbgv
        with:
          stamp: package.json

      - name: 🗣️ NBGV outputs
        run: |
          echo "SimpleVersion: ${{ steps.nbgv.outputs.SimpleVersion }}"

      - name: 📦 Package
        run: |
          npx vsce package -o ./${{ github.event.repository.name}}.vsix

      - name: 📰 Publish
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: 📦 Publish to Open VSX
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npx ovsx publish "./${{ github.event.repository.name}}.vsix"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: 🔗 Marketplace Link
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "## 🚀 Published Extension" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.nbgv.outputs.SimpleVersion }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Marketplace** | [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=timheuer.vscode-agent-plugins) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Open VSX** | [Open VSX Registry](https://open-vsx.org/extension/smhc/agent-plugins-installer) |" >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name}}.vsix
          path: ./*.vsix

      - name: 🏷️ Tag and Release
        id: tag_release
        uses: softprops/action-gh-release@v1
        with:
          body: Release ${{ steps.nbgv.outputs.SimpleVersion }}
          tag_name: ${{ steps.nbgv.outputs.SimpleVersion }}
          generate_release_notes: true
          files: ./*.vsix
